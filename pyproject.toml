[project]
name = "action-tesa-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.133.0",
    "fastapi>=0.136.0",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.40.0",
]

[project.scripts]
action-tesa-etl = "action_tesa_etl:main"
action-tesa-exposor = "action_tesa_etl.exposor.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
